name: JUCE prototype Android APK

on:
  push:
    paths:
      - 'prototypes/juce/**'
      - 'prototypes/common/audio_core/**'
      - '.github/workflows/juce-prototype-ci.yml'
  pull_request:
    paths:
      - 'prototypes/juce/**'
      - 'prototypes/common/audio_core/**'
      - '.github/workflows/juce-prototype-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juce-prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  juce-apk:
    name: JUCE Android ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: original_sequencer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: original_sequencer
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Projucer build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config xvfb xauth \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxrender-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Fetch pinned JUCE source
        run: |
          git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/JUCE"
          test "$(git -C "$GITHUB_WORKSPACE/JUCE" rev-parse HEAD)" = '72782788ce18c2d4d760b28e0921d6ffc6431102'
      - name: Run common core tests
        run: |
          cmake -S prototypes -B build-juce-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DORIGINAL_SEQUENCER_BUILD_TESTS=ON
          cmake --build build-juce-tests --parallel 2
          ctest --test-dir build-juce-tests --output-on-failure
      - name: Build Projucer
        run: |
          cmake -S "$GITHUB_WORKSPACE/JUCE" -B "$RUNNER_TEMP/juce-tools" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" -DJUCE_BUILD_EXTRAS=ON
          cmake --build "$RUNNER_TEMP/juce-tools" --target Projucer --parallel 2
      - name: Export and configure Android project
        run: |
          xvfb-run -a "$RUNNER_TEMP/juce-tools/extras/Projucer/Projucer_artefacts/Release/Projucer" \
            --resave prototypes/juce/SequencerPrototype.jucer
          python3 prototypes/juce/configure_android_export.py
          python3 prototypes/juce/verify_android_export.py --require-generated
      - name: Install pinned Android components
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build JUCE test APK
        working-directory: original_sequencer/prototypes/juce/Builds/Android
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify JNI packaging and record metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from zipfile import ZipFile
          apks = list(Path('prototypes/juce/Builds/Android/app/build/outputs/apk').rglob('*-debug.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one debug APK, got {apks}')
          with ZipFile(apks[0]) as archive:
              if 'lib/arm64-v8a/libjuce_jni.so' not in archive.namelist():
                  raise SystemExit('APK is missing ARM64 JUCE JNI library')
          out = Path('dist/juce')
          out.mkdir(parents=True, exist_ok=True)
          apk = out / 'juce-arm64-debug.apk'
          shutil.copyfile(apks[0], apk)
          metadata = {'commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
                      'juce': '9.0.2', 'abi': 'arm64-v8a', 'build_type': 'debug',
                      'application_id': 'com.originalsequencer.juceprototype',
                      'sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}
          (out / 'build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY
      - name: Save JUCE APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sequencer-juce-arm64-debug-${{ github.sha }}
          path: original_sequencer/dist/juce/
          if-no-files-found: error
          retention-days: 14
