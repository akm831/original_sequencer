name: Prototype tests and Android APK

on:
  push:
    paths:
      - 'prototypes/**'
      - '.github/workflows/prototype-ci.yml'
  pull_request:
    paths:
      - 'prototypes/**'
      - '.github/workflows/prototype-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: C++ host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure with assertions enabled
        run: cmake -S prototypes -B build-ci -DCMAKE_BUILD_TYPE=Debug -DORIGINAL_SEQUENCER_BUILD_TESTS=ON
      - name: Build host tests
        run: cmake --build build-ci --parallel 2
      - name: Run host tests
        run: ctest --test-dir build-ci --output-on-failure

  flutter-apk:
    name: Flutter Android ARM64 debug APK
    needs: core-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: '3.47.2'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    defaults:
      run:
        working-directory: prototypes/flutter_native/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Bootstrap Flutter
        run: |
          flutter config --no-analytics
          flutter --version
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Install pinned Android components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Resolve Dart dependencies
        run: |
          flutter pub get
          echo "RESOLVED_LOCK_BEGIN"
          cat pubspec.lock
          echo "RESOLVED_LOCK_END"
      - name: Analyze Flutter code
        run: flutter analyze --fatal-infos
      - name: Run Flutter widget tests
        run: flutter test
      - name: Build test APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify native libraries and record build metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('build/app/outputs/flutter-apk/app-debug.apk')
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              required = {
                  'lib/arm64-v8a/liboriginal_sequencer_flutter_bridge.so',
                  'lib/arm64-v8a/libc++_shared.so',
                  'lib/arm64-v8a/libflutter.so',
              }
              missing = required - names
              if missing:
                  raise SystemExit(f'APK is missing native libraries: {sorted(missing)}')
          metadata = {
              'commit': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'flutter': os.environ['FLUTTER_VERSION'],
              'abi': 'arm64-v8a',
              'build_type': 'debug',
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
          }
          apk.with_name('build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY
      - name: Save APK and build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sequencer-arm64-debug-${{ github.sha }}
          path: |
            prototypes/flutter_native/app/build/app/outputs/flutter-apk/app-debug.apk
            prototypes/flutter_native/app/build/app/outputs/flutter-apk/build-info.json
          if-no-files-found: error
          retention-days: 14
